<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<style>
  .bg{fill:#ffffff}
  .title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111827}
  .sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#4b5563}
  .h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111827}
  .t{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#374151}
  .small{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#4b5563}
  .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2937}
  .box{fill:#f9fafb;stroke:#cbd5e1;stroke-width:1.5;rx:12}
  .blue{fill:#eff6ff;stroke:#93c5fd}
  .green{fill:#ecfdf5;stroke:#86efac}
  .amber{fill:#fffbeb;stroke:#fcd34d}
  .purple{fill:#f5f3ff;stroke:#c4b5fd}
  .branch{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:14}
  .line{stroke:#64748b;stroke-width:2.2;fill:none}
  .arrow{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
  .dash{stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6;fill:none}
  .pill{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.2;rx:9}
  .note{fill:#fff7ed;stroke:#fdba74;stroke-width:1.2;rx:10}
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="1600" height="720"/>
<text class="title" x="48" y="58">KLP methodology pipeline</text>
<text class="sub" x="48" y="88">Testing whether Dog A adds predictive information about Dog B's future behavior</text>

<!-- top pipeline -->
<rect class="box blue" x="48" y="130" width="210" height="250"/>
<text class="h" x="68" y="164">1. Interaction data</text>
<text class="t" x="68" y="198">Natural multi-dog video</text>
<text class="t" x="68" y="224">Shared audio track</text>
<line class="line" x1="68" y1="246" x2="238" y2="246"/>
<text class="small" x="68" y="276">Video provides dog-specific</text>
<text class="small" x="68" y="296">visual measurements.</text>
<text class="small" x="68" y="326">Audio is scene-level in the</text>
<text class="small" x="68" y="346">current web-video pilot.</text>

<rect class="box" x="300" y="130" width="220" height="250"/>
<text class="h" x="320" y="164">2. Perception</text>
<rect class="pill" x="320" y="190" width="180" height="36"/><text class="mono" x="347" y="214">YOLO11s</text>
<rect class="pill" x="320" y="236" width="180" height="36"/><text class="mono" x="355" y="260">ByteTrack</text>
<rect class="pill" x="320" y="282" width="180" height="36"/><text class="mono" x="337" y="306">YOLO11s-pose</text>
<rect class="pill" x="320" y="328" width="180" height="36"/><text class="small" x="337" y="351">camera stabilization</text>

<rect class="box green" x="562" y="130" width="245" height="250"/>
<text class="h" x="582" y="164">3. Behavioral features</text>
<text class="t" x="582" y="201">motion / speed</text>
<text class="t" x="582" y="228">pose</text>
<text class="t" x="582" y="255">orientation</text>
<text class="t" x="582" y="282">inter-dog distance</text>
<text class="t" x="582" y="309">visibility / context</text>
<text class="t" x="582" y="336">audio features*</text>
<text class="small" x="582" y="360">*sender attribution limited</text>

<rect class="box amber" x="849" y="130" width="205" height="250"/>
<text class="h" x="869" y="164">4. Temporal windows</text>
<rect class="pill" x="874" y="197" width="70" height="58"/>
<text class="h" x="891" y="220">past</text><text class="small" x="896" y="242">1 s</text>
<path class="arrow" d="M950 226 L988 226"/>
<rect class="pill" x="994" y="197" width="40" height="58"/>
<text class="small" x="1002" y="220">next</text><text class="small" x="1005" y="242">1 s</text>
<text class="t" x="874" y="291">stride: 0.5 s</text>
<text class="small" x="874" y="321">Dog A = sender</text>
<text class="small" x="874" y="344">Dog B = receiver</text>

<rect class="box purple" x="1096" y="130" width="245" height="250"/>
<text class="h" x="1116" y="164">5. Prediction test</text>
<rect class="pill" x="1116" y="191" width="205" height="62"/>
<text class="small" x="1130" y="215">baseline</text>
<text class="mono" x="1130" y="239">B past -> B future</text>
<rect class="pill" x="1116" y="267" width="205" height="70"/>
<text class="small" x="1130" y="291">sender + receiver</text>
<text class="mono" x="1130" y="315">A past + B past</text>
<text class="mono" x="1130" y="333">-> B future</text>
<text class="small" x="1116" y="365">Delta_sender = full - baseline</text>

<rect class="box" x="1383" y="130" width="169" height="250"/>
<text class="h" x="1403" y="164">6. Evaluation</text>
<text class="t" x="1403" y="202">held-out channels</text>
<text class="t" x="1403" y="229">sender shuffle</text>
<text class="t" x="1403" y="256">temporal shift</text>
<text class="t" x="1403" y="283">modality ablation</text>
<line class="line" x1="1403" y1="305" x2="1532" y2="305"/>
<text class="small" x="1403" y="332">R² / MAE</text>
<text class="small" x="1403" y="355">incremental value</text>

<path class="arrow" d="M258 255 L292 255"/>
<path class="arrow" d="M520 255 L554 255"/>
<path class="arrow" d="M807 255 L841 255"/>
<path class="arrow" d="M1054 255 L1088 255"/>
<path class="arrow" d="M1341 255 L1375 255"/>

<!-- event branch -->
<rect class="branch" x="300" y="438" width="1041" height="190"/>
<text class="h" x="324" y="472">Event-centered analysis</text>
<text class="small" x="324" y="497">Tests whether structured receiver changes are concentrated around specific sender behavior changes.</text>

<rect class="pill" x="324" y="523" width="225" height="78"/>
<text class="h" x="342" y="548">Detect sender event</text>
<text class="small" x="342" y="572">start / stop / approach /</text>
<text class="small" x="342" y="591">withdraw / turn toward / away</text>

<path class="arrow" d="M549 562 L590 562"/>

<rect class="pill" x="596" y="523" width="205" height="78"/>
<text class="h" x="614" y="548">Measure Dog B</text>
<text class="small" x="614" y="573">Δ distance / orientation /</text>
<text class="small" x="614" y="592">speed</text>

<path class="arrow" d="M801 562 L842 562"/>

<rect class="pill" x="848" y="523" width="250" height="78"/>
<text class="h" x="866" y="548">Matched controls</text>
<text class="small" x="866" y="573">similar moments from same video,</text>
<text class="small" x="866" y="592">away from that event type</text>

<path class="arrow" d="M1098 562 L1139 562"/>

<rect class="note" x="1145" y="511" width="172" height="102"/>
<text class="h" x="1163" y="539">Evidence level</text>
<text class="small" x="1163" y="565">predictive / event-response</text>
<text class="small" x="1163" y="584">relationships — not semantic</text>
<text class="small" x="1163" y="603">meaning or causation</text>

<!-- branch connection -->
<path class="dash" d="M685 380 L685 419 L415 419 L415 438"/>
<text class="small" x="695" y="414">alternative analysis</text>

<text class="small" x="48" y="682">KLP v0 · exploratory pilot · current web-video audio uses a shared microphone, so vocalizer attribution is not reliable.</text>
</svg>