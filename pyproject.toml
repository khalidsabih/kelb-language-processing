[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "klp"
version = "0.1.0"
description = "KLP (Kelb Language Processing): receiver-grounded canine communication research scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Track-extraction pilot (scripts/pilot/); installs PyTorch.
pilot = ["ultralytics>=8.3", "yt-dlp", "lap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
